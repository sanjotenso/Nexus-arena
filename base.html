<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NEXUS ARENA{% end %}</title>
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="/" class="logo">NEXUS<span>ARENA</span></a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
            <div class="nav-links" id="navLinks">
                <a href="/tournaments">Tournaments</a>
                <a href="/leaderboard">Leaderboard</a>
                {% if user %}
                <a href="/dashboard">Dashboard</a>
                {% if user.get('role') == 'admin' %}
                <a href="/admin">Admin</a>
                {% end %}
                <a href="/profile/{{ user['id'] }}">Profile</a>
                <a href="/logout" class="btn btn-outline">Logout</a>
                {% else %}
                <a href="/login" class="btn btn-outline">Login</a>
                <a href="/register" class="btn btn-primary">Register</a>
                {% end %}
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% end %}
    </main>
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 NEXUS ARENA. All rights reserved.</p>
        </div>
    </footer>
    <div id="toast-container"></div>
    <script src="{{ static_url('js/app.js') }}"></script>
</body>
</html>
